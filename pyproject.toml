[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "vehicle_metadata_identification_using_machine_learning"
version = "0.0.1"
description = "Review console and integration layer for ML vehicle metadata extraction"
authors = [
  { name = "AutoVision" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "==3.11.4"


[tool.ruff]
line-length = 99
src = ["vehicle_metadata_identification_using_machine_learning"]
include = ["pyproject.toml", "vehicle_metadata_identification_using_machine_learning/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["vehicle_metadata_identification_using_machine_learning"]
force-sort-within-sections = true

